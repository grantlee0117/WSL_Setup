# ============================================================
#  starship 提示符 — Catppuccin Mocha
#  部署到 ~/.config/starship.toml（由 5-terminal/setup.sh 自动部署）
#  图标依赖 Nerd Font（5-terminal 已装 JetBrainsMono Nerd Font），
#  否则箭头/图标会显示成方块。
# ============================================================

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'catppuccin_mocha'

# 单行：目录 → git → 语言版本(按项目自动出现) → 容器 → 耗时，换行后再出输入符
format = """
$directory\
$git_branch\
$git_status\
$nodejs$python$rust$golang$java$c\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
format = "[ $path ]($style)"
read_only = " "

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch ]($style)"

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2000          # 只在命令跑超过 2s 时显示
style = "yellow"
format = "[ $duration ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version) ]($style)"
[python]
symbol = " "
style = "yellow"
format = "[$symbol($version) ]($style)"
[rust]
symbol = " "
style = "peach"
format = "[$symbol($version) ]($style)"
[golang]
symbol = " "
style = "sky"
format = "[$symbol($version) ]($style)"
[java]
symbol = " "
style = "red"
format = "[$symbol($version) ]($style)"
[c]
symbol = " "
style = "blue"
format = "[$symbol($version) ]($style)"
[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context ]($style)"

