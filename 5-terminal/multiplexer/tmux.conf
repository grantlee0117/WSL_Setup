# ============================================================
#  tmux 配置
#  前缀: Ctrl+A | 配色: Catppuccin Mocha
#  场景: Claude Code / Night-Night / Agent Team 监控
# ============================================================

# ─── 前缀键 ─────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── 基础设置 ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # 真彩色(24-bit)：tmux 3.2+ 现代写法，加性叠加、不易被覆盖（替代旧的 terminal-overrides）
set -g mouse on                    # 鼠标: 点击切换 pane, 滚轮翻页, 拖拉调整大小
set -g base-index 1                # 窗口编号从 1 开始
setw -g pane-base-index 1          # Pane 编号从 1 开始
set -g renumber-windows on         # 关闭窗口后重新编号
set -g history-limit 100000        # 大滚动缓冲区 (Claude Code 长输出)
set -g escape-time 0               # 按 Esc 不等待
set -g focus-events on
set -g set-clipboard on            # 系统剪贴板集成

# ─── Vim 风格切换 Pane (大小写均可) ─────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H select-pane -L
bind J select-pane -D
bind K select-pane -U
bind L select-pane -R

# ─── 调整 Pane 大小 (Alt+hjkl, 不需要前缀键, 大小写均可) ─
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# ─── 新窗口/分屏继承当前目录 ──────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ─── 快捷操作 ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "配置已重载!"
bind R source-file ~/.tmux.conf \; display "配置已重载!"
bind s choose-tree -Zs          # 会话树（带预览、可缩放；比老 choose-session 顺手）
bind S choose-tree -Zs
bind C-q display-panes          # Ctrl+A Ctrl+Q：显示各 pane 编号、按数字跳（找回被布局键 q 占用掉的默认 display-panes）

# ─── 复制模式 (Vi 风格) ──────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"

# ─── 状态栏 (Catppuccin Mocha 配色) ──────────────────────

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# 左侧: session 名
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e] "

# 右侧: 时间
set -g status-right-length 50
set -g status-right "#[fg=#6c7086]│ #[fg=#cdd6f4]%m/%d #[fg=#89b4fa,bold]%H:%M "

# 窗口标签
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "

# Pane 边框
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# 消息样式
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"

# ─── Agent Team 快捷布局 ─────────────────────────────────
# Ctrl+A a/A → 三格布局 (1 大 + 2 小)
bind a \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-pane -t 1 \; \
    display "Agent Team 三格布局就绪!"
bind A \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-pane -t 1 \; \
    display "Agent Team 三格布局就绪!"

# Ctrl+A q/Q → 田字格布局 (4 等分)
bind q \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-layout tiled \; \
    select-pane -t 1 \; \
    display "Agent Team 田字格布局就绪!"
bind Q \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-layout tiled \; \
    select-pane -t 1 \; \
    display "Agent Team 田字格布局就绪!"

# ─── 插件 (TPM) ──────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# resurrect/continuum 只存/恢复"会话骨架"：窗口数、分屏布局、各 pane 工作目录，
# 加上当时屏幕的文字快照(capture-pane-contents)。它【不保存正在跑的进程】——
# tmux 真退出后(wsl --shutdown / 电脑重启 / server 被杀)那些命令已经没了，
# 恢复出来是新 shell、只是布局和文字长得一样。想让长任务过夜不丢，靠的是
# "只 detach、别关机"(Ctrl+A d，进程在后台真还跑着)，不是这套插件续命。
set -g @plugin 'tmux-plugins/tmux-resurrect'       # Ctrl+A Ctrl+S 存骨架, Ctrl+A Ctrl+R 恢复骨架
set -g @plugin 'tmux-plugins/tmux-continuum'        # 定时自动存骨架 + 启动时自动恢复

# resurrect 配置
set -g @resurrect-capture-pane-contents 'on'        # 连屏幕文字一起存(仅快照、非进程)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'                # 每 10 分钟自动存一次

# 初始化 TPM (必须在最后)
run '~/.tmux/plugins/tpm/tpm'
