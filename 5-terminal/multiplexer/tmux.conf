# ============================================================
#  tmux 配置
#  前缀: Ctrl+A | 配色: Catppuccin Mocha
#  场景: Claude Code / Night-Night / Agent Team 监控
# ============================================================

# ─── 前缀键 ─────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── 基础设置 ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # 真彩色(24-bit)：tmux 3.2+ 现代写法，加性叠加、不易被覆盖（替代旧的 terminal-overrides）
set -g mouse on                    # 鼠标: 点击切换 pane, 滚轮翻页, 拖拉调整大小
set -g base-index 1                # 窗口编号从 1 开始
setw -g pane-base-index 1          # Pane 编号从 1 开始
set -g renumber-windows on         # 关闭窗口后重新编号
set -g history-limit 100000        # 大滚动缓冲区 (Claude Code 长输出)
set -g escape-time 0               # 按 Esc 不等待
set -g focus-events on
set -g set-clipboard on            # 系统剪贴板集成
set -g display-time 2000           # 提示消息显示 2 秒(够看清广播/告警提示，原默认 0.75 秒太短)

# ─── 切换 Pane: 方向键 (tmux 自带, 前缀 + ←↓↑→) ──────────
# 不再绑 hjkl：方向键直观、本就是 tmux 默认，少记一套；鼠标点击也能切。
# 顺带把 prefix+l 还给 tmux 默认的"跳上一个窗口"（原来被 hjkl 的 l 占掉了）。

# ─── 调整 Pane 大小 (Alt + 方向键, 不用前缀) ──────────────
bind -n M-Left  resize-pane -L 5
bind -n M-Down  resize-pane -D 5
bind -n M-Up    resize-pane -U 5
bind -n M-Right resize-pane -R 5

# ─── 新窗口/分屏继承当前目录 ──────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ─── 快捷操作 ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "配置已重载!"
bind R source-file ~/.tmux.conf \; display "配置已重载!"
bind s choose-tree -Zs          # 会话树（带预览、可缩放；比老 choose-session 顺手）
bind S choose-tree -Zs
bind C-q display-panes          # Ctrl+A Ctrl+Q：显示各 pane 编号、按数字跳（找回被布局键 q 占用掉的默认 display-panes）

# ─── 复制模式 (Vi 风格) ──────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"

# ─── 状态栏 (Catppuccin Mocha 配色) ──────────────────────

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# 左侧: session 名 + 指示灯(按下前缀亮黄 PREFIX，开广播亮红 SYNC)
set -g status-left-length 60
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e,fg=#cdd6f4]#{?client_prefix,#[fg=#1e1e2e bg=#f9e2af bold] PREFIX #[fg=#cdd6f4 bg=#1e1e2e],}#{?pane_synchronized,#[fg=#1e1e2e bg=#f38ba8 bold] SYNC #[fg=#cdd6f4 bg=#1e1e2e],} "

# 右侧: CPU 占用 + 电池 + 日期时间（纯文字+颜色，不依赖 Nerd Font）
set -g status-right-length 100
set -g status-right "#{cpu_fg_color}CPU #{cpu_percentage}#[fg=#6c7086] │ #{battery_color_fg}BAT #{battery_percentage}#[fg=#6c7086] │ #[fg=#cdd6f4]%m/%d #[fg=#89b4fa,bold]%H:%M "

# 窗口标签
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "
setw -g window-status-activity-style "fg=#f9e2af,bold"   # 有新输出的窗口标签：黄色高亮
setw -g window-status-bell-style "fg=#f38ba8,bold"       # 响铃的窗口标签：红色高亮

# Pane 边框
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Pane 标题栏: 每个 pane 顶部显示「编号 命令」，多格监控时分清谁是谁（活动 pane 蓝色高亮）
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#89b4fa bold],#[fg=#6c7086]} #P #{pane_current_command} "

# 消息样式
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"

# ─── Agent Team 快捷布局 ─────────────────────────────────
# Ctrl+A a/A → 三格布局 (1 大 + 2 小)
bind a \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-pane -t 1 \; \
    display "Agent Team 三格布局就绪!"
bind A \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-pane -t 1 \; \
    display "Agent Team 三格布局就绪!"

# Ctrl+A q/Q → 田字格布局 (4 等分)
bind q \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-layout tiled \; \
    select-pane -t 1 \; \
    display "Agent Team 田字格布局就绪!"
bind Q \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-layout tiled \; \
    select-pane -t 1 \; \
    display "Agent Team 田字格布局就绪!"

# ─── 多格协同 / 监控 (Agent Team / 挂长任务) ─────────────
# 广播输入: Ctrl+A e 开/关。开了之后你敲的命令同时发给【当前窗口所有 pane】。
# 开 N 格各跑一个 Claude/agent 时，cd、启动、同一条命令一次发齐；状态栏会亮红色 SYNC。
bind e setw synchronize-panes \; display "广播输入: #{?pane_synchronized,▶ 开 (所有 pane 同步),■ 关}"
bind E setw synchronize-panes \; display "广播输入: #{?pane_synchronized,▶ 开 (所有 pane 同步),■ 关}"

# 活动/响铃监控: 别的窗口有新输出或响铃时，底部该窗口标签自动高亮（不弹消息打断你）。
setw -g monitor-activity on
set  -g visual-activity off
setw -g monitor-bell on
set  -g visual-bell off

# 静默告警: Ctrl+A M 给当前 pane 设"安静 N 秒就提醒"——长任务跑完不再刷屏时通知你，输 0 关闭。
bind M command-prompt -p "静默告警(秒, 0=关):" "setw monitor-silence '%%'"

# ─── 浮动弹窗 (临时终端，不打乱当前分屏) ─────────────────
# Ctrl+A g: 在当前布局之上浮一个终端，在当前 pane 的目录里临时敲命令（git status、
# 快速 grep、跑 lazygit 等），exit / Ctrl+D 关掉，下面的分屏原封不动。
# 想让它直接起某个程序，把末尾加上命令，如 ... -T "lazygit" "lazygit"（需先装 lazygit）。
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -T " 浮动终端 (exit / Ctrl+D 关闭) "

# ─── 插件 (TPM) ──────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# resurrect/continuum 只存/恢复"会话骨架"：窗口数、分屏布局、各 pane 工作目录，
# 加上当时屏幕的文字快照(capture-pane-contents)。它【不保存正在跑的进程】——
# tmux 真退出后(wsl --shutdown / 电脑重启 / server 被杀)那些命令已经没了，
# 恢复出来是新 shell、只是布局和文字长得一样。想让长任务过夜不丢，靠的是
# "只 detach、别关机"(Ctrl+A d，进程在后台真还跑着)，不是这套插件续命。
set -g @plugin 'tmux-plugins/tmux-resurrect'       # Ctrl+A Ctrl+S 存骨架, Ctrl+A Ctrl+R 恢复骨架
set -g @plugin 'tmux-plugins/tmux-continuum'        # 定时自动存骨架 + 启动时自动恢复
set -g @plugin 'tmux-plugins/tmux-cpu'             # 状态栏 CPU 占用
set -g @plugin 'tmux-plugins/tmux-battery'         # 状态栏电池（本机 WSL 能原生读 /sys/.../BAT1）

# resurrect 配置
set -g @resurrect-capture-pane-contents 'on'        # 连屏幕文字一起存(仅快照、非进程)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'                # 每 10 分钟自动存一次

# 初始化 TPM (必须在最后)
run '~/.tmux/plugins/tpm/tpm'
