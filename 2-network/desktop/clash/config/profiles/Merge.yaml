# ════════════════════════════════════════════════════════════════════════════
#
#   Clash Verge Rev 全局扩展覆写配置 (Merge.yaml)
#
#   更新: 2025-01-15
#   作者：lichunyuan
# ════════════════════════════════════════════════════════════════════════════
#
#   【本文件职责】
#
#   本文件只负责「覆盖」订阅中的基础配置项，如：
#   - 端口设置
#   - TUN 模式
#   - 性能参数
#
#   节点、策略组、规则 请在 Script.js 中配置！
#   （v1.7.x 移除了 prepend/append 功能，YAML 无法追加）
#
# ════════════════════════════════════════════════════════════════════════════
#
#   【执行链路】
#
#   订阅原始配置
#       ↓
#   本文件 (Merge.yaml) ──→ 覆盖基础配置
#       ↓
#   全局扩展脚本 (Script.js) ──→ 添加节点/策略组/规则
#       ↓
#   最终生效配置
#
# ════════════════════════════════════════════════════════════════════════════


# ────────────────────────────────────────────────────────────────────────────
#                              1. 基础设置
# ────────────────────────────────────────────────────────────────────────────

# 混合代理端口：HTTP/SOCKS5 共用此端口
mixed-port: 7897

# 允许局域网设备连接（手机、平板通过电脑代理上网）
allow-lan: true

# 监听地址：* 表示监听所有网卡
bind-address: "*"

# 禁用 IPv6：防止 IPv6 流量绕过代理泄漏
ipv6: false

# 代理模式：rule = 按规则分流
mode: rule

# 日志级别
log-level: info

# 进程匹配模式：strict = 严格模式，精确匹配进程名
find-process-mode: strict


# ────────────────────────────────────────────────────────────────────────────
#                              2. 性能优化
# ────────────────────────────────────────────────────────────────────────────

# TCP 并发：同时向多个节点发起连接，选最快的
tcp-concurrent: true

# 统一延迟计算：消除不同协议的测速差异
unified-delay: true

# 全局指纹伪装：模拟 Chrome 浏览器，降低被识别风险
global-client-fingerprint: chrome


# ────────────────────────────────────────────────────────────────────────────
#                              3. 状态记忆
# ────────────────────────────────────────────────────────────────────────────

profile:
  # 记住用户选择的节点
  store-selected: true
  # 记住 Fake-IP 映射缓存
  store-fake-ip: true


# ────────────────────────────────────────────────────────────────────────────
#                              4. TUN 虚拟网卡
# ────────────────────────────────────────────────────────────────────────────
#
# TUN 模式会创建一个虚拟网卡，所有系统流量都经过它
# 优点：无遗漏，连不支持代理设置的软件也能代理
# 缺点：需要管理员权限
#

tun:
  # 启用 TUN 模式
  enable: true
  # 网络栈：system 最稳定，gvisor 性能好但兼容性略差
  stack: system
  # DNS 劫持：拦截所有 53 端口的 DNS 请求
  dns-hijack:
    - any:53
  # 自动配置路由表
  auto-route: true
  # 自动检测出口网卡
  auto-detect-interface: true


# ════════════════════════════════════════════════════════════════════════════
#
#                            配置文件结束
#
# ════════════════════════════════════════════════════════════════════════════
#
#   【重要提醒】
#
#   1. 节点、策略组、规则 请在 Script.js 中配置
#   2. v1.7.x 的 prepend-rules / proxies+ 等语法已失效
#   3. 本文件只负责覆盖基础配置项
#
#   【验证配置】
#
#   在 Clash Verge 中：订阅卡片 → 右键 → 查看运行时配置
#   可以看到最终合并后的完整配置
