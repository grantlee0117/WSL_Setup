# ============================================================
#  tmux 配置
#  前缀: Ctrl+A | 配色: Catppuccin Mocha
#  场景: Claude Code / Night-Night / Agent Team 监控
# ============================================================

# ─── 前缀键 ─────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── 基础设置 ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on                    # 鼠标: 点击切换 pane, 滚轮翻页, 拖拉调整大小
set -g base-index 1                # 窗口编号从 1 开始
setw -g pane-base-index 1          # Pane 编号从 1 开始
set -g renumber-windows on         # 关闭窗口后重新编号
set -g history-limit 100000        # 大滚动缓冲区 (Claude Code 长输出)
set -g escape-time 0               # 按 Esc 不等待
set -g focus-events on
set -g set-clipboard on            # 系统剪贴板集成

# ─── Vim 风格切换 Pane ────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── 调整 Pane 大小 (Alt + hjkl, 不需要前缀键) ──────────
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# ─── 新窗口/分屏继承当前目录 ──────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ─── 快捷操作 ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "配置已重载!"
bind s choose-session

# ─── 复制模式 (Vi 风格) ──────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"

# ─── 状态栏 (Catppuccin Mocha 配色) ──────────────────────

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# 左侧: session 名
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e] "

# 右侧: 时间
set -g status-right-length 50
set -g status-right "#[fg=#6c7086]│ #[fg=#cdd6f4]%m/%d #[fg=#89b4fa,bold]%H:%M "

# 窗口标签
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "

# Pane 边框
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# 消息样式
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"

# ─── Agent Team 快捷布局 ─────────────────────────────────
# Ctrl+A a → 三格布局 (1 大 + 2 小)
bind a \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-pane -t 1 \; \
    display "Agent Team 三格布局就绪!"

# Ctrl+A q → 田字格布局 (4 等分)
bind q \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-pane -t 1 \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-pane -t 1 \; \
    display "Agent Team 田字格布局就绪!"

# ─── 插件 (TPM) ──────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'       # Ctrl+A Ctrl+S 保存, Ctrl+A Ctrl+R 恢复
set -g @plugin 'tmux-plugins/tmux-continuum'        # 自动保存/恢复

# resurrect 配置
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'                # 每 10 分钟自动保存

# 初始化 TPM (必须在最后)
run '~/.tmux/plugins/tpm/tpm'
